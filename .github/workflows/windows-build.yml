name: Windows installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build and test
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: VARD-EEG-ERP-Setup-Windows-x64
          path: dist/installer/*Setup*-x64.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: VARD-EEG-ERP-build-diagnostics
          path: |
            dist/installer/SHA256.txt
            dist/requirements-windows-built.txt
            dist/bundle-smoke.json
            build/vard/warn-vard.txt
          if-no-files-found: ignore
